[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast_translator"
version = "0.1.0"
description = "PodCast Translator AI Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "PyJWT>=2.8",
    "python-jose>=3.3",
    "cryptography>=42.0",
    "httpx>=0.27",
    "aioboto3>=12.0.0",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
pipeline = [
    "numpy<2",
    "demucs>=4.0.0",
    "pyannote.audio>=3.1.0,<3.2.0",
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "dashscope>=1.20.0",
    "pydub>=0.25.0",
]
voxcpm = [
    "voxcpm",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 字符串前向引用（Mapped["User"] / relationship("Speaker")）由 ORM 注册表在运行时解析，ruff 静态误报 F821。
"src/models/*.py" = ["F821"]
# 必须先调用 _patch_huggingface_hub_auth_token_compat() 再 import pyannote，import 故意不在文件顶部。
"src/pipeline/stages/s2_speaker_diarization.py" = ["E402"]
# 测试用 pytest.importorskip 守卫，相关 import 故意位于守卫之后。
"tests/**" = ["E402"]
