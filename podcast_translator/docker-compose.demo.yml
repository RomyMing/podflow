services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PODFLOW_DEMO_POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: podcast_translator
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d podcast_translator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_demo_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${PCT_S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${PCT_S3_SECRET_KEY:-minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "${PODFLOW_MINIO_API_PORT:-9000}:9000"
      - "${PODFLOW_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_demo_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${PODFLOW_IMAGE_NAMESPACE}/podflow-api:${PODFLOW_IMAGE_TAG:-demo-latest}
    restart: unless-stopped
    env_file:
      - .env.demo
    environment:
      PCT_DATABASE_URL: postgresql+asyncpg://postgres:${PODFLOW_DEMO_POSTGRES_PASSWORD:-postgres_password}@postgres:5432/podcast_translator
      PCT_REDIS_URL: redis://redis:6379/0
      PCT_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12

  worker:
    image: ${PODFLOW_IMAGE_NAMESPACE}/podflow-worker:${PODFLOW_IMAGE_TAG:-demo-latest}
    restart: unless-stopped
    env_file:
      - .env.demo
    environment:
      PCT_DATABASE_URL: postgresql+asyncpg://postgres:${PODFLOW_DEMO_POSTGRES_PASSWORD:-postgres_password}@postgres:5432/podcast_translator
      PCT_REDIS_URL: redis://redis:6379/0
      PCT_S3_ENDPOINT: http://minio:9000
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: ${PODFLOW_IMAGE_NAMESPACE}/podflow-worker:${PODFLOW_IMAGE_TAG:-demo-latest}
    restart: unless-stopped
    env_file:
      - .env.demo
    environment:
      PCT_DATABASE_URL: postgresql+asyncpg://postgres:${PODFLOW_DEMO_POSTGRES_PASSWORD:-postgres_password}@postgres:5432/podcast_translator
      PCT_REDIS_URL: redis://redis:6379/0
      PCT_S3_ENDPOINT: http://minio:9000
    command: celery -A src.workers.celery_app:celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${PODFLOW_IMAGE_NAMESPACE}/podflow-frontend:${PODFLOW_IMAGE_TAG:-demo-latest}
    restart: unless-stopped
    environment:
      PCT_FRONTEND_PROXY_TARGET: ${PCT_FRONTEND_PROXY_TARGET:-http://backend:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PODFLOW_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  postgres_demo_data:
  redis_demo_data:
  minio_demo_data:
