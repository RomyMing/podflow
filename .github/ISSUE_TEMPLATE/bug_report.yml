name: Bug report
description: Report a reproducible PodFlow problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, personal audio, phone numbers, and other sensitive data before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - Mock
        - Real
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction. Do not attach private audio.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, Docker version, browser, CPU/GPU
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
