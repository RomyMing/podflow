name: Real Pipeline Smoke

# Manually triggered smoke check for the REAL AI pipeline. Unlike the default CI
# (mock mode), this installs the heavy pipeline dependencies and — when provider
# secrets are configured — runs a lightweight provider preflight. It never runs on
# push/PR because it is slow and consumes real provider quota.

on:
  workflow_dispatch:
    inputs:
      run_preflight:
        description: "Run live provider preflight (consumes real provider quota)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-smoke:
    runs-on: ubuntu-latest
    environment: real-smoke
    defaults:
      run:
        working-directory: podcast_translator
    env:
      PCT_PIPELINE_MODE: real
      PCT_SECRET_KEY: smoke-secret-key
      PCT_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5433/podcast_translator_test
      PCT_REDIS_URL: redis://localhost:6379/0
      PCT_S3_ENDPOINT: http://localhost:9000
      PCT_S3_BUCKET: podcast-translator-audio
      PCT_S3_ACCESS_KEY: admin
      PCT_S3_SECRET_KEY: minio_password
      PCT_DEEPSEEK_API_KEY: ${{ secrets.PCT_DEEPSEEK_API_KEY }}
      PCT_HF_TOKEN: ${{ secrets.PCT_HF_TOKEN }}
      PCT_ELEVENLABS_API_KEY: ${{ secrets.PCT_ELEVENLABS_API_KEY }}
      PCT_DASHSCOPE_API_KEY: ${{ secrets.PCT_DASHSCOPE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -e .[dev,pipeline]

      - name: Smoke-import heavy pipeline modules
        run: |
          python -c "import torch, torchaudio, pyannote.audio; from faster_whisper import WhisperModel; import demucs; print('real deps import ok')"

      - name: Live provider preflight
        if: ${{ inputs.run_preflight }}
        run: |
          python - <<'PY'
          import asyncio
          from src.services.provider_preflight_service import ProviderPreflightService
          from src.services.user_api_key_service import resolve_provider_credentials

          async def main():
              # Probe only the configured provider credentials (no storage/local-runtime
              # checks, which need infra not present in this job). A bad key raises and
              # fails the step; a missing key is skipped.
              svc = ProviderPreflightService()
              for provider in ["deepseek", "elevenlabs", "dashscope", "huggingface"]:
                  creds = await resolve_provider_credentials(None, provider)
                  if creds is None:
                      print(f"skip {provider}: no key configured")
                      continue
                  await svc.verify_credentials(creds)
                  print(f"{provider} ok")

          asyncio.run(main())
          PY
