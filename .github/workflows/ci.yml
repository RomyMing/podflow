name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: podcast_translator
    env:
      PCT_APP_ENV: dev
      PCT_APP_MODE: prod
      PCT_AUTH_MODE: sms
      PCT_ENABLE_SMS_LOGIN: true
      PCT_SHOW_DEMO_BANNER: false
      PCT_ENABLE_SAMPLE_TASKS: false
      PCT_ALLOW_USER_UPLOAD: true
      PCT_ENABLE_REAL_COST_FEATURES: false
      PCT_DEMO_USER_PHONE: 13800138000
      PCT_DEMO_USER_NICKNAME: PodFlow Demo
      PCT_DEFAULT_MONTHLY_QUOTA: 5
      PCT_SECRET_KEY: ci-secret-key
      PCT_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5433/podcast_translator_test
      PCT_REDIS_URL: redis://localhost:6379/0
      PCT_S3_ENDPOINT: http://localhost:9000
      PCT_S3_PUBLIC_ENDPOINT: http://localhost:9000
      PCT_S3_BUCKET: podcast-translator-audio
      PCT_S3_ACCESS_KEY: admin
      PCT_S3_SECRET_KEY: minio_password
      PCT_OPENAI_API_KEY: mock-openai-key
      PCT_SMS_PROVIDER: mock
      PCT_PIPELINE_MODE: mock
      PCT_MOCK_PIPELINE_STAGE_DELAY_SECONDS: 0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Start test services
        run: docker compose --profile test up -d postgres_test redis minio

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint backend
        run: ruff check src tests

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Stop test services
        if: always()
        run: docker compose --profile test down -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: podcast_translator/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: podcast_translator/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        env:
          NEXT_PUBLIC_PCT_APP_MODE: prod
          NEXT_PUBLIC_PCT_AUTH_MODE: sms
          NEXT_PUBLIC_PCT_SHOW_DEMO_BANNER: false
          NEXT_PUBLIC_PCT_ENABLE_SAMPLE_TASKS: false
          NEXT_PUBLIC_PCT_ALLOW_USER_UPLOAD: true
        run: npm run build
